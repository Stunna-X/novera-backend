name: novera-release-smoke

x-api-environment: &api-environment
  APP_ENV: production
  DEBUG: "false"
  ENABLE_API_DOCS: "false"
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/novera_release
  SECRET_KEY: release-smoke-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  CORS_ORIGINS: '["https://app.release-smoke.novera.app"]'
  EMAIL_PROVIDER: manual
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: novera_release
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d novera_release
      interval: 3s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    ports:
      - "127.0.0.1:${NOVERA_RELEASE_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
